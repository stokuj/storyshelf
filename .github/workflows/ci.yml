name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Run ruff
        working-directory: backend-django
        run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: booksdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret-key
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_ENV: dev
      DATABASE_URL: postgres://postgres:secret-key@localhost:5432/booksdb
      DJANGO_SECRET_KEY: test-secret-key-for-ci
      OPENROUTER_API_KEY: sk-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Django system check
        working-directory: backend-django
        run: uv run python manage.py check
      - name: Check for missing migrations
        working-directory: backend-django
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Run Django tests
        working-directory: backend-django
        run: uv run python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: svelte-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: svelte-frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: booksdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret-key
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_ENV: dev
      DATABASE_URL: postgres://postgres:secret-key@localhost:5432/booksdb
      DJANGO_SECRET_KEY: test-secret-key-for-ci
      OPENROUTER_API_KEY: sk-dummy
      # Vite dev proxy + SvelteKit SSR both target the local Django over /api.
      INTERNAL_API_URL: http://localhost:8000/api
      PUBLIC_API_URL: http://localhost:8000/api
      # runserver (unlike pytest) keeps throttling on; the sequential suite does
      # ~100+ registrations/logins per run — above the prod defaults. Anonymous
      # (IP-keyed) scopes need relaxing here; per-user scopes are fine since every
      # test uses a fresh user.
      THROTTLE_AUTH_REGISTER: 120/min
      THROTTLE_AUTH_LOGIN: 120/min
      THROTTLE_AUTH_REFRESH: 120/min
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Migrate and create e2e admin
        working-directory: backend-django
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py shell -c "from django.contrib.auth import get_user_model as g; U=g(); U.objects.filter(email='admin@e2e.test').exists() or U.objects.create_superuser(email='admin@e2e.test', handle='admin', password='admin123', display_name='Admin')"
      - name: Start Django backend
        working-directory: backend-django
        run: |
          uv run python manage.py runserver 0.0.0.0:8000 --noreload > /tmp/django.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/docs/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/api/docs/ >/dev/null || { echo "Django did not start:"; cat /tmp/django.log; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: svelte-frontend/package-lock.json
      - name: Install frontend deps
        working-directory: svelte-frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: svelte-frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: svelte-frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: svelte-frontend/playwright-report/
          retention-days: 7

  build-and-push:
    needs: [lint, test, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend-django
          file: backend-django/Dockerfile
          push: true
          tags: ghcr.io/stokuj/storyshelf-django:main
      - uses: docker/build-push-action@v6
        with:
          context: svelte-frontend
          file: svelte-frontend/Dockerfile.prod
          push: true
          tags: ghcr.io/stokuj/storyshelf-svelte:main

