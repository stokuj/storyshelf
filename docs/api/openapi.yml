openapi: 3.0.3
info:
  title: StoryShelf API
  version: 1.0.0
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: 'Logowanie. Ustawia HttpOnly cookies. Pola: email, password.'
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Wylogowanie. Czyści cookies i blacklistuje refresh token.
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Odświeża access token z HttpOnly refresh cookie. Ustawia nowe cookies.
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: 'Rejestracja nowego użytkownika. Pola: email, handle, password.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/u/{handle}/:
    get:
      operationId: u_retrieve
      description: |-
        Publiczny profil użytkownika po handle. Zwraca 404 jeśli profil jest prywatny
        i requestujący nie jest właścicielem.
      parameters:
      - in: path
        name: handle
        schema:
          type: string
        required: true
      tags:
      - u
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/users/:
    get:
      operationId: users_list
      description: |-
        Public, paginated list of public profiles. Search by handle/display_name;
        order by recency (default) or handle.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: per_page
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - users
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserListList'
          description: ''
  /api/users/me/:
    get:
      operationId: users_me_retrieve
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: users_me_partial_update
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: users_me_destroy
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/users/me/avatar/:
    patch:
      operationId: users_me_avatar_partial_update
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/users/me/email/:
    patch:
      operationId: users_me_email_partial_update
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/users/me/export/:
    post:
      operationId: users_me_export_create
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/users/me/password/:
    patch:
      operationId: users_me_password_partial_update
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/users/me/settings/:
    get:
      operationId: users_me_settings_retrieve
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: users_me_settings_partial_update
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    PaginatedUserListList:
      type: object
      required:
      - data
      - page
      - per_page
      - total
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserList'
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total:
          type: integer
          example: 100
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
        handle:
          type: string
          maxLength: 30
          pattern: ^[a-z]{3,30}$
        display_name:
          type: string
          default: ''
          maxLength: 80
        password:
          type: string
          writeOnly: true
          maxLength: 72
          minLength: 8
      required:
      - email
      - handle
      - password
    UserList:
      type: object
      properties:
        handle:
          type: string
          maxLength: 30
        display_name:
          type: string
          maxLength: 80
        avatar_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
      required:
      - avatar_url
      - handle
    UserProfile:
      type: object
      properties:
        handle:
          type: string
          maxLength: 30
        display_name:
          type: string
          maxLength: 80
        bio:
          type: string
          maxLength: 500
        avatar_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
        member_since:
          type: string
          format: date-time
          readOnly: true
        profile_public:
          type: boolean
      required:
      - avatar_url
      - handle
      - member_since
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
