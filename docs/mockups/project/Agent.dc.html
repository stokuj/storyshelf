<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Add book — Agent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;family=Public+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#FCFBF8}a{color:#A9471F}a:hover{color:#7E3415}</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; background: #FCFBF8; font-family: 'Public Sans', system-ui, sans-serif; color: #26201B">
  <dc-import name="Sidebar" active="" hint-size="260px,900px"></dc-import>
  <main style="flex: 999 1 560px; min-width: 0; padding: 28px 48px 32px; box-sizing: border-box; display: flex; flex-direction: column">
    <div style="max-width: 760px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; flex: 1">
      <h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 32px; font-weight: 600">Add a book</h1>
      <p style="margin: 0; font-size: 15px; color: #4A423B">Type a title, or just what you remember from the story.</p>

      <div style="display: flex; flex-direction: column; gap: 16px; flex: 1">
        <div style="align-self: flex-end; max-width: 70%; padding: 12px 16px; border-radius: 16px 16px 4px 16px; background: #26201B; color: #FCFBF8; font-size: 15px">Dodaj wiedźmina tom 1</div>

        <div style="align-self: flex-start; max-width: 100%; display: flex; flex-direction: column; gap: 12px">
          <div style="padding: 12px 16px; border-radius: 16px 16px 16px 4px; background: #FFFFFF; border: 1px solid #E8E3DA; font-size: 15px; line-height: 1.5">„Tom 1” może znaczyć dwie rzeczy. Czy chodzi o jedną z tych książek?</div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
            <sc-for list="{{cands}}" as="k" hint-placeholder-count="2">
              <div style="display: flex; gap: 14px; padding: 14px; border: 1px solid #E8E3DA; border-radius: 14px; background: #FFFFFF">
                <span style="{{k.cover}}">[COVER]</span>
                <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
                  <span style="font-family: 'Newsreader', Georgia, serif; font-size: 19px; font-weight: 600">{{k.title}}</span>
                  <span style="font-size: 14px; color: #4A423B">{{k.author}} · {{k.year}}</span>
                  <span style="font-size: 13px; color: #6E665E">{{k.note}}</span>
                  <div style="display: flex; gap: 8px; margin-top: 8px">
                    <a href="Empty.dc.html" style="display: inline-flex; align-items: center; height: 40px; padding: 0 14px; border-radius: 10px; background: #B5502A; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none">Yes, add</a>
                  </div>
                </div>
              </div>
            </sc-for>
          </div>
          <button type="button" style="align-self: flex-start; height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #E0DAD0; background: #FFFFFF; font: inherit; font-size: 14px; color: #26201B">None of these</button>
        </div>
      </div>

      <form style="display: flex; gap: 8px; padding: 8px; border: 1px solid #E0DAD0; border-radius: 14px; background: #FFFFFF">
        <label style="flex: 1; display: flex">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message to Agent</span>
          <input type="text" placeholder="np. „ta, gdzie ocean na planecie myśli”" style="flex: 1; border: 0; outline: 0; font: inherit; font-size: 15px; padding: 0 8px; background: transparent; color: #26201B">
        </label>
        <button type="submit" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #26201B; color: #FCFBF8; font: inherit; font-size: 14px; font-weight: 600">Send</button>
      </form>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const cover = (bg) => 'width: 72px; height: 106px; flex: none; border-radius: 6px; background: ' + bg + '; color: #EDE6D8; font-size: 11px; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box';
    return {
      cands: [
        { title: 'Ostatnie życzenie', author: 'Andrzej Sapkowski', year: '1993', note: 'Wiedźmin · zbiór opowiadań, pierwszy chronologicznie', cover: cover('#2F3A33') },
        { title: 'Krew elfów', author: 'Andrzej Sapkowski', year: '1994', note: 'Wiedźmin · tom 1 sagi', cover: cover('#5A2E2A') }
      ]
    };
  }
}
</script>
</body>
</html>
